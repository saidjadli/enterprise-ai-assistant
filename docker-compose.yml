services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: enterprise-ai-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - ./vectorstore:/app/vectorstore


  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: enterprise-ai-frontend

    ports:
      - "8501:8501"

    environment:
      - BACKEND_URL=http://backend:8000/api/ask

    depends_on:
      - backend