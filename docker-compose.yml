services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: enterprise-ai-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - chroma_data:/app/vectorstore
      - ./data/documents:/app/data/documents

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

    restart: unless-stopped


  ingestion:
    build:
      context: .
      dockerfile: backend/Dockerfile

    env_file:
      - .env

    volumes:
      - chroma_data:/app/vectorstore
      - ./data/documents:/app/data/documents

    command:
      [
        "python",
        "scripts/ingest.py"
      ]

    profiles:
      - ingestion


  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: enterprise-ai-frontend

    ports:
      - "8501:8501"

    environment:
      - BACKEND_URL=http://backend:8000/api/ask

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped


volumes:

  chroma_data: