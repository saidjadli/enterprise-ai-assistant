services:

  
  # Redis
  

  redis:
    image: redis:7-alpine

    container_name: enterprise-ai-redis

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 5s
      timeout: 3s
      retries: 10

    volumes:
      - redis_data:/data

    restart: unless-stopped


  
  # Backend
  

  backend:
    image: ${COMPOSE_PROJECT_NAME:-enterprise-ai-assistant}-backend

    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: enterprise-ai-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      - REDIS_URL=redis://redis:6379/0

    volumes:
      # Persistent Chroma vector database
      - chroma_data:/app/vectorstore

      # PDF documents
      - ./data/documents:/app/data/documents

      # Persistent authentication database
      - users_data:/app/data/auth

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

    restart: unless-stopped


  
  # Ingestion
  

  ingestion:
    # Use the same image as backend, including when only backend
    # is rebuilt.
    image: ${COMPOSE_PROJECT_NAME:-enterprise-ai-assistant}-backend

    build:
      context: .
      dockerfile: backend/Dockerfile

    env_file:
      - .env

    volumes:
      # Chroma database
      - chroma_data:/app/vectorstore

      # PDF documents
      - ./data/documents:/app/data/documents

    command:
      [
        "python",
        "scripts/ingest.py"
      ]

    profiles:
      - ingestion


  
  # Frontend
  

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: enterprise-ai-frontend

    ports:
      - "8501:8501"

    environment:
      - BACKEND_URL=http://backend:8000/api/ask

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped



# Persistent volumes


volumes:

  # Chroma vector database
  chroma_data:

  # Redis conversation memory
  redis_data:

  # Authentication / users database
  users_data: